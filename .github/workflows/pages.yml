name: Deploy Web Edition to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - "server/**"
      - "assets/**"
      - "tests/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Web Edition Node.js Engine & Asset Tests
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Web Engine, Assets & Global Accounts API
        run: |
          node tests/web_engine_test.mjs
          node tests/global_api_test.mjs

      - name: Stage static site bundle
        run: |
          mkdir -p _site/assets
          cp -r web/* _site/
          cp -r assets/* _site/assets/
          touch _site/.nojekyll
          test -f _site/CNAME
          test -f _site/index.html
          test -f _site/js/prequel.js
          test -f _site/assets/music/ending_perfect.ogg
          test -f _site/assets/music/prequel_act1_falkreath.ogg
          test -f _site/assets/images/prequel/pedestal_chamber.jpg

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
